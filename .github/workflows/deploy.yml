name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Deploy do front (hosting). Functions e Firestore Rules ficam FORA deste
      # workflow — deploy manual com aprovação humana (PLANO_DE_ACAO.md 5.1).
      #
      # Pré-requisito (feito pelo PO no GitHub, não neste repositório):
      #   - Secret `FIREBASE_SERVICE_ACCOUNT` com o JSON da service account
      #     (Settings -> Secrets -> Actions -> New repository secret).
      #   - O projeto `admoirmaozinho` deve ter o Hosting habilitado.
      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: admoirmaozinho
